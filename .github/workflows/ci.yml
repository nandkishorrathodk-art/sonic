name: SONIC CI/CD

on:
  push:
    branches: [development, main, "departments/**"]
  pull_request:
    branches: [development, main, "departments/**"]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            services/core/pyproject.toml
            apps/cli/pyproject.toml
            packages/avcs/pyproject.toml
            uv.lock

      - name: Sync locked Python workspace
        run: uv sync --locked --all-packages --extra dev

      - name: Ruff check
        run: |
          uv run --locked --all-packages --extra dev ruff check services/core/sonic --output-format=github
          uv run --locked --all-packages --extra dev ruff check apps/cli/sonic_cli --output-format=github

      - name: Build Python distributions
        run: uv build --all-packages --out-dir "$RUNNER_TEMP/python-dists"

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            services/core/pyproject.toml
            apps/cli/pyproject.toml
            packages/avcs/pyproject.toml
            uv.lock

      - name: Sync locked Python workspace
        run: uv sync --locked --all-packages --extra dev

      - name: Run mypy on the employee runtime surface
        run: uv run --locked --all-packages --extra dev python -m mypy --config-file services/core/pyproject.toml --follow-imports=skip services/core/sonic/organization services/core/sonic/computer_use/teamwork.py services/core/sonic/api/routes/organization.py services/core/sonic/api/main.py

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      SONIC_ALLOW_HOST_EXECUTION: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            services/core/pyproject.toml
            apps/cli/pyproject.toml
            packages/avcs/pyproject.toml
            uv.lock

      - name: Sync locked Python workspace
        run: uv sync --locked --all-packages --extra dev

      - name: P0 security and safety tests
        run: |
          uv run --locked --all-packages --extra dev python -m pytest \
            services/core/tests/test_p0_security_hardening.py \
            services/core/tests/test_phase_plan6_safety_envelope.py \
            -ra --tb=short

      - name: Complete Python workspace test suite
        run: uv run --locked --all-packages --extra dev python -m pytest -ra --tb=short

  rust:
    name: Native Kernel Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run kernel tests
        run: cargo test --locked --manifest-path packages/kernel/Cargo.toml

  dashboard:
    name: Dashboard Lint, Audit, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        working-directory: apps/dashboard
        run: npm ci

      - name: Lint dashboard
        working-directory: apps/dashboard
        run: npm run lint

      - name: Audit production dependencies
        working-directory: apps/dashboard
        run: npm audit --omit=dev --audit-level=high

      - name: Type check dashboard
        working-directory: apps/dashboard
        run: npx tsc --noEmit

      - name: Build dashboard
        working-directory: apps/dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:12000

  docker:
    name: Production Container Build
    needs: [lint, typecheck, test, rust, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build SONIC Core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/core/Dockerfile
          push: false
          tags: sonic-core:ci
          cache-from: type=gha,scope=sonic-core
          cache-to: type=gha,mode=max,scope=sonic-core

      - name: Build SONIC Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: apps/dashboard
          file: apps/dashboard/Dockerfile
          push: false
          tags: sonic-dashboard:ci
          cache-from: type=gha,scope=sonic-dashboard
          cache-to: type=gha,mode=max,scope=sonic-dashboard

  publish:
    name: Publish Release Images
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SONIC Core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/core/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/sonic-core:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/sonic-core:main
          cache-from: type=gha,scope=sonic-core
          cache-to: type=gha,mode=max,scope=sonic-core

      - name: Publish SONIC Dashboard
        uses: docker/build-push-action@v6
        with:
          context: apps/dashboard
          file: apps/dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/sonic-dashboard:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/sonic-dashboard:main
          cache-from: type=gha,scope=sonic-dashboard
          cache-to: type=gha,mode=max,scope=sonic-dashboard

  delivery-gate:
    name: Continuous Delivery Gate
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Release summary
        run: |
          echo "SONIC release published successfully."
          echo "Core image: ${{ env.REGISTRY }}/${{ github.repository }}/sonic-core:${{ github.sha }}"
          echo "Dashboard image: ${{ env.REGISTRY }}/${{ github.repository }}/sonic-dashboard:${{ github.sha }}"
          echo "Production deployment is intentionally separate from image publication."