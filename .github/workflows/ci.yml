name: CI/CD Pipeline — SONIC

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-python:
    name: Lint Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.8.6"

      - name: Run ruff (core)
        run: ruff check sonic-core/sonic --output-format=github

      - name: Run ruff (cli)
        run: ruff check sonic-cli/sonic_cli --output-format=github

  test-python:
    name: Backend Test Suite (pytest)
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      SONIC_ALLOW_HOST_EXECUTION: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend + dev deps
        run: |
          pip install --upgrade pip
          pip install -e "sonic-core[dev]"
          pip install -e "sonic-cli[dev]"

      - name: Run P0 Security Hardening & Safety Tests
        run: python -m pytest sonic-core/tests/test_p0_security_hardening.py sonic-core/tests/test_phase_plan6_safety_envelope.py -ra --tb=short

      - name: Run Core Test Suite
        run: |
          python -m pytest sonic-core/tests/ \
            --ignore=sonic-core/tests/test_phase13 \
            --ignore=sonic-core/tests/test_phase14 \
            --ignore=sonic-core/tests/test_phase15 \
            --ignore=sonic-core/tests/test_phase16 \
            --ignore=sonic-core/tests/test_phase17 \
            --ignore=sonic-core/tests/test_phase18 \
            --ignore=sonic-core/tests/test_phase19 \
            --ignore=sonic-core/tests/test_phase21_real_graphical_workstation.py \
            -ra --tb=short

  dashboard-build:
    name: Next.js Dashboard Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sonic-dashboard/package-lock.json

      - name: Install Dashboard Dependencies
        run: |
          cd sonic-dashboard
          npm ci || npm install

      - name: Build Next.js Dashboard
        run: |
          cd sonic-dashboard
          npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://127.0.0.1:12000"

  typecheck-python:
    name: Type Check Python (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend + dev deps
        run: |
          pip install --upgrade pip
          pip install -e "sonic-core[dev]"

      - name: Run mypy
        run: python -m mypy sonic-core/sonic || true
        continue-on-error: true
