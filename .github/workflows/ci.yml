name: SONIC CI/CD

on:
  push:
    branches: [development, main, "departments/**"]
  pull_request:
    branches: [development, main, "departments/**"]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            sonic-core/pyproject.toml
            sonic-cli/pyproject.toml

      - name: Install backend and CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e "sonic-core[dev]"
          pip install -e "sonic-cli[dev]"

      - name: Ruff check
        run: |
          ruff check sonic-core/sonic --output-format=github
          ruff check sonic-cli/sonic_cli --output-format=github

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            sonic-core/pyproject.toml
            sonic-cli/pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "sonic-core[dev]"

      - name: Run mypy on the employee runtime surface
        run: python -m mypy --config-file sonic-core/pyproject.toml --follow-imports=skip sonic-core/sonic/organization sonic-core/sonic/computer_use/teamwork.py sonic-core/sonic/api/routes/organization.py sonic-core/sonic/api/main.py

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      SONIC_ALLOW_HOST_EXECUTION: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            sonic-core/pyproject.toml
            sonic-cli/pyproject.toml

      - name: Install backend and CLI
        run: |
          python -m pip install --upgrade pip
          pip install -e "sonic-core[dev]"
          pip install -e "sonic-cli[dev]"

      - name: P0 security and safety tests
        run: |
          python -m pytest \
            sonic-core/tests/test_p0_security_hardening.py \
            sonic-core/tests/test_phase_plan6_safety_envelope.py \
            -ra --tb=short

      - name: Core test suite
        run: |
          python -m pytest sonic-core/tests/ \
            --ignore=sonic-core/tests/test_phase21_real_graphical_workstation.py \
            -ra --tb=short

  rust:
    name: Native Kernel Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run kernel tests
        run: cargo test --locked --manifest-path sonic-kernel-rs/Cargo.toml

  dashboard:
    name: Dashboard Lint, Audit, Type Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: sonic-dashboard/package-lock.json

      - name: Install dependencies
        working-directory: sonic-dashboard
        run: npm ci

      - name: Lint dashboard
        working-directory: sonic-dashboard
        run: npm run lint

      - name: Audit production dependencies
        working-directory: sonic-dashboard
        run: npm audit --omit=dev --audit-level=high

      - name: Type check dashboard
        working-directory: sonic-dashboard
        run: npx tsc --noEmit

      - name: Build dashboard
        working-directory: sonic-dashboard
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

  docker:
    name: Production Container Build
    needs: [lint, typecheck, test, rust, dashboard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build SONIC Core image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sonic-core/Dockerfile
          push: false
          tags: sonic-core:ci
          cache-from: type=gha,scope=sonic-core
          cache-to: type=gha,mode=max,scope=sonic-core

      - name: Build SONIC Dashboard image
        uses: docker/build-push-action@v6
        with:
          context: sonic-dashboard
          file: sonic-dashboard/Dockerfile
          push: false
          tags: sonic-dashboard:ci
          cache-from: type=gha,scope=sonic-dashboard
          cache-to: type=gha,mode=max,scope=sonic-dashboard

  publish:
    name: Publish Release Images
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish SONIC Core
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sonic-core/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/sonic-core:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/sonic-core:main
          cache-from: type=gha,scope=sonic-core
          cache-to: type=gha,mode=max,scope=sonic-core

      - name: Publish SONIC Dashboard
        uses: docker/build-push-action@v6
        with:
          context: sonic-dashboard
          file: sonic-dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/sonic-dashboard:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository }}/sonic-dashboard:main
          cache-from: type=gha,scope=sonic-dashboard
          cache-to: type=gha,mode=max,scope=sonic-dashboard

  delivery-gate:
    name: Continuous Delivery Gate
    needs: publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Release summary
        run: |
          echo "SONIC release published successfully."
          echo "Core image: ${{ env.REGISTRY }}/${{ github.repository }}/sonic-core:${{ github.sha }}"
          echo "Dashboard image: ${{ env.REGISTRY }}/${{ github.repository }}/sonic-dashboard:${{ github.sha }}"
          echo "Production deployment is intentionally separate from image publication."