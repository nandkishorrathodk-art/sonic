[project]
name = "sonic-monorepo"
version = "0.4.0"
description = "SONIC — Autonomous AI-Human Digital Being"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}

[tool.uv.workspace]
members = ["services/core", "apps/cli", "packages/avcs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/core/tests", "apps/cli/tests", "packages/avcs/tests"]
pythonpath = ["services/core", "apps/cli", "packages/avcs"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",
    "E402",
    "E741",
    "E701",
    "W293",
    "N801",
    "N805",
    "N806",
    "N818",
    "UP022",
]

[tool.mypy]
python_version = "3.12"
strict = true
